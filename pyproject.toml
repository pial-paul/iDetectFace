[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "idetectface"
version = "0.1.0"
description = "Local webcam attendance for supervised check-ins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dlib-bin==20.0.1.post1",
    "face-recognition-models==0.3.0",
    "filelock==4.2.12",
    "numpy==2.2.6",
    "opencv-python==4.14.0.94",
    "Pillow==13.0.0",
]

[project.scripts]
idetectface = "idetectface.cli:main"

[tool.setuptools]
packages = ["idetectface"]
include-package-data = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
